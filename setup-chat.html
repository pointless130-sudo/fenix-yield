<style>
:root {
  --bg:      #0a0a0f;
  --surface: #13131a;
  --surface2:#1a1a24;
  --border:  #1e1e2e;
  --accent:  #7c5cfc;
  --accent2: #4fc3f7;
  --success: #4caf7d;
  --text:    #e8e8f0;
  --muted:   #6b6b8a;
  --font:    'Inter', system-ui, sans-serif;
  --mono:    'SF Mono', 'Fira Code', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

/* ── Header ── */
.header {
  background: linear-gradient(160deg, #0e0e1a, #12102a);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.header-logo {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}

.header-info { flex: 1; }
.header-info h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
.header-info p  { font-size: 12px; color: var(--success); margin-top: 1px; }

.header-link {
  font-size: 12px; color: var(--muted);
  text-decoration: none; padding: 6px 12px;
  border: 1px solid var(--border); border-radius: 8px;
  transition: all 0.15s; flex-shrink: 0;
}
.header-link:hover { border-color: var(--accent); color: var(--text); }

/* ── Progress bar ── */
.progress-bar {
  height: 3px;
  background: var(--border);
  flex-shrink: 0;
  position: relative;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  width: 0%;
  transition: width 0.5s ease;
}

/* ── Step indicator ── */
.step-indicator {
  display: flex;
  gap: 4px;
  padding: 10px 20px 8px;
  overflow-x: auto;
  scrollbar-width: none;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.step-indicator::-webkit-scrollbar { display: none; }

.step-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; color: var(--muted);
  flex-shrink: 0; transition: all 0.2s; cursor: default;
}
.step-dot.active {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(124,92,252,0.1);
}
.step-dot.done {
  border-color: var(--success);
  background: var(--success);
  color: #fff;
}

/* ── Chat area ── */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}

/* ── Messages ── */
.msg {
  display: flex;
  gap: 10px;
  max-width: 100%;
  animation: fadeUp 0.2s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0; margin-top: 2px;
}

.msg.bot .msg-avatar {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
}

.msg.user .msg-avatar {
  background: var(--surface2);
  border: 1px solid var(--border);
}

.msg-bubble {
  max-width: calc(100% - 48px);
  padding: 12px 14px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.6;
}

.msg.bot .msg-bubble {
  background: var(--surface);
  border: 1px solid var(--border);
  border-top-left-radius: 4px;
  color: var(--text);
}

.msg.user .msg-bubble {
  background: linear-gradient(135deg, var(--accent), #5b3fd8);
  color: #fff;
  border-top-right-radius: 4px;
}

.msg-bubble p { margin-bottom: 8px; }
.msg-bubble p:last-child { margin-bottom: 0; }

.msg-bubble .copy-addr {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent2);
  margin: 8px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  word-break: break-all;
}

.copy-mini {
  background: var(--border);
  border: none; border-radius: 4px;
  padding: 3px 8px; font-size: 10px;
  color: var(--muted); cursor: pointer;
  flex-shrink: 0; transition: all 0.15s;
}
.copy-mini:hover { background: var(--accent); color: #fff; }

/* ── Quick replies ── */
.quick-replies {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0 16px 12px;
  flex-shrink: 0;
}

.qr-btn {
  padding: 8px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.qr-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ── Typing indicator ── */
.typing {
  display: flex; gap: 10px; align-items: center;
}
.typing-dots {
  display: flex; gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  border-top-left-radius: 4px;
  padding: 12px 16px;
}
.typing-dots span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--muted);
  animation: bounce 1.2s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30%            { transform: translateY(-5px); opacity: 1; }
}

/* ── Input area ── */
.input-area {
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  flex-shrink: 0;
  background: var(--bg);
}

.input-wrap {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  align-items: flex-end;
  padding: 2px 4px 2px 14px;
  transition: border-color 0.15s;
}
.input-wrap:focus-within { border-color: var(--accent); }

#userInput {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  resize: none;
  outline: none;
  max-height: 120px;
  min-height: 40px;
  padding: 10px 0;
  line-height: 1.5;
}
#userInput::placeholder { color: var(--muted); }

.send-btn {
  width: 36px; height: 36px;
  border-radius: 9px;
  border: none;
  background: linear-gradient(135deg, var(--accent), #5b3fd8);
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.15s;
  flex-shrink: 0;
  margin-bottom: 2px;
}
.send-btn:hover { opacity: 0.85; }
.send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── Checklist inside bubble ── */
.inline-check { 
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0; font-size: 13px; color: var(--muted);
  cursor: pointer; user-select: none;
}
.inline-check.done { color: var(--success); }
.inline-check .ic-box {
  width: 18px; height: 18px; border-radius: 5px;
  border: 1.5px solid var(--muted);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 11px; transition: all 0.15s;
}
.inline-check.done .ic-box { background: var(--success); border-color: var(--success); color: #fff; }

/* ── Step complete badge ── */
.step-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(76,175,125,0.15);
  border: 1px solid rgba(76,175,125,0.3);
  color: var(--success);
  border-radius: 20px;
  padding: 4px 12px; font-size: 12px; font-weight: 600;
  margin-top: 8px;
}
</style>
</head>

<script type="module">
// ── State ─────────────────────────────────────────────────────────────────────
let conversation = [];
let isTyping     = false;

// The setup-chat proxy (api.fenix-yield.com) reads this prompt straight from the live
// page and ignores the one the browser sends, so editing it here edits the assistant
// within about 10 minutes. Keep it ONE double-quoted string, declared once at the start of
// its line, with nothing joined onto it and no commented-out copy anywhere in the page: the
// proxy refuses anything else, alerts, and keeps serving its last good copy. Before pushing
// an edit, run ops/setup-chat-proxy/check-page.js from the fenix-mobile-api repo.
const SYSTEM_PROMPT = "You are the Fenix Yield onboarding assistant. Your job is to help people understand and use the Fenix Yield app, step by step.\n\nFenix Yield is an Ethereum staking app for Android, made by Fenix Labs LLC in Texas. The app creates a vault the user owns on Ethereum, secured by their phone's passkey and a 12-word recovery phrase. From the app they can stake ETH across five pools: Lido, Rocket Pool, Aave, Curve and Convex.\n\nGETTING STARTED. Walk users through these steps:\n1. PHONE SETUP: Before installing, their phone must be ready (see PHONE SETUP below): Android 10 or newer, a screen lock set, and a Google account signed in. Full 2-minute guide: https://fenix-yield.com/phone-setup.html\n2. INSTALL: The app is on Google Play, in the US only for now. Tell users to search the Play Store for Fenix Yield, or open https://play.google.com/store/apps/details?id=com.fenixyield.app. Outside the US, Fenix Intel members can download it directly from https://intel.fenix-yield.com/app#direct. Never give any other download link.\n3. CREATE WALLET: Open the app and follow the steps to create a vault. If someone gave them a referral code, they enter it on this screen before creating the vault. The app shows a 12-word recovery phrase, which they must write on paper and keep safe. They confirm two of the words, then approve with their fingerprint, face or screen lock.\n4. MEMBERSHIP: They subscribe inside the app, and Google Play bills it.\n5. DEPOSIT ETH: The app shows their vault address. They send ETH to it from any wallet or exchange, on the Ethereum network only. The minimum to activate the vault is 0.01 ETH. The vault activates automatically after that first deposit, which can take a few minutes.\n6. STAKE: In the stake sheet they pick a pool, or choose Auto so Fenix uses the pool showing the highest rate when they stake, leaving out Convex. They tap Stake Now, and a confirmation appears before it runs. To have new deposits staked automatically, they set Auto-stake to Daily or Weekly. Stake Now saves whatever that setting shows, so they should choose Off if they only want this one stake. A deposit earns nothing until it is staked. Lido, Aave, Curve and Convex are ready to use. Rocket Pool unlocks once in the app with one passkey approval.\n7. CHECK PROGRESS: Home shows their balance and where it is staked. Markets compares each pool's current rate. Portfolio shows how their balance has moved over time, and their holdings and earnings can be exported as a spreadsheet. Chat is Fenix AI, an assistant inside the app that answers questions using their real balance. It can suggest an action, but only the user can approve it.\n8. WITHDRAW FROM A POOL: On Home, under In your vault, they tap the pool and choose Withdraw to vault, for all or part of it. It comes back to their vault as ETH, approved with their passkey.\n9. SEND ETH OUT: They can send ETH from their vault to any other wallet with Send ETH, approved with their passkey. Only ETH that is available in the vault can be sent, so ETH in a pool must be withdrawn first.\n\nKEY FACTS:\n- Keys: the passkey stays on the user's device and only they hold the 12-word recovery phrase. Fenix's servers never see the phrase, only its address.\n- Fenix's automation stakes idle ETH into the pools they have enabled, using a wallet whose key Fenix holds and an on-chain permission (Zodiac Roles). That permission limits which contracts it can reach and refuses a direct ETH send to any other address, but it does not limit every action on those contracts, so a stolen automation key could move funds out of the vault. If asked, say so plainly. In the app, sending ETH out of the vault needs their passkey. Never say that Fenix cannot move their ETH at all, never say the automation cannot send funds elsewhere, never call the app non-custodial or self-custody, and never say the phrase is the only key.\n- Automatic staking only puts idle ETH into a pool. It does not switch or withdraw ETH that is already staked on its own; the user starts those.\n- Earnings build up inside each pool, so they are already in the balance. There is no harvest, no reinvesting and nothing to collect. Never say that rewards compound automatically or get collected for them.\n- Rates: Fenix quotes a range of 1.5% to 5% a year across the pools. Rates move a lot and any pool can fall below that range. The Markets tab shows live rates. Whenever you discuss rates or yield, say that yields are variable and not guaranteed, and that this is not financial advice.\n- Never call anything guaranteed or risk-free, never describe it as passive income, and never predict prices. Do not recommend a specific pool as the right choice for someone; explain the differences and let them decide.\n- If a membership ends, their funds keep earning and withdrawals stay open.\n\nTHE FIVE POOLS:\n- Lido: liquid staking. The user holds stETH, which earns staking rewards daily, with no validator to run.\n- Rocket Pool: decentralized staking run by independent node operators. The user holds rETH, which grows in ETH value as rewards accrue. It unlocks with one passkey approval.\n- Aave: a decentralized lending protocol. The ETH earns variable interest from borrowers.\n- Curve: a liquidity pool. The ETH joins the stETH/ETH pool and earns trading fees and the staking yield of the stETH it holds.\n- Convex: holds that same Curve position and earns about what Curve does, at higher network fees, so Auto leaves it out. Its own CRV and CVX rewards are close to zero right now. Fenix does not collect them, they are not in the balance, and they stay the user's on Convex.\n\nRISKS. Be honest about these when asked, and whenever someone asks whether it is safe: the pools are third-party smart contracts that can fail, the value of ETH goes up and down, stETH can trade below ETH, rates change every day, and network fees can exceed what a small position earns. If someone loses their recovery phrase, Fenix cannot recover it for them.\n\nPRICING:\n- One monthly membership, billed through Google Play: USD 28.99 a month for a new subscriber's first 12 months, then USD 38.99 a month. Google Play shows the exact price before they pay. Always say the first-year price is for new subscribers.\n- The first-year price appears automatically at checkout. There is NO promo code to enter. It is for Google accounts that have not had this subscription before. If someone asks about a code such as LAUNCH29, reassure them there is nothing to type.\n- It renews monthly, and they can cancel anytime in Google Play. Access continues until the end of the current month.\n- Fenix takes no percentage of their yield.\n- Do NOT frame paying outside the store as a way to avoid store fees.\n- Refunds for Google Play purchases follow Google Play's policy. See https://fenix-yield.com/refund-policy.html\n\nNETWORK (GAS) FEES:\nEvery on-chain action (stake, switch pools, withdraw, send) pays an Ethereum network fee, which changes with how busy the network is. The app shows the exact fee in ETH and USD before the user confirms and deducts it from that transaction at cost, with no markup from Fenix. The first stake after setup and one withdrawal per calendar month are covered by Fenix up to a capped amount. If a fee would ever exceed 5% of the amount being moved, the app stops and suggests waiting for lower gas or moving a larger amount.\n\nPHONE SETUP (BEFORE INSTALLING):\nThe app protects the wallet with a passkey, so the phone must be ready first. Walk users through this checklist when they are about to install, or whenever wallet creation fails:\n1. Screen lock set: REQUIRED (Settings > Security > Screen lock: PIN, pattern or password. Adding fingerprint or face unlock is strongly recommended so approvals are one touch).\n2. Signed into a Google account on the phone: REQUIRED (Settings > Passwords & accounts > Add account > Google). The passkey is stored by Google and the app installs through Google Play.\n3. Google enabled for passkeys: usually already on (Settings > Passwords & accounts > Passkeys, make sure Google is enabled).\n4. Android 10 or newer (Settings > About phone > Android version).\n5. Google Play up to date.\nTROUBLESHOOTING: If wallet creation mentions a missing screen lock, 'no create options available', or 'your phone is not set up to create passkeys', it is almost always a missing screen lock or no Google account on the phone. Have them complete steps 1 to 3, reopen the app and tap Try again. By this point the app has already shown them their 12 words, so they should keep what they wrote down. If the app restarted and shows a different phrase, they must write down the new one and throw away the old one, because the phrase on screen when the vault is created is the one that counts. If a user cannot find the app on Google Play: it is available in the US only for now, and outside the US Google Play says it is not available in their country. Otherwise have them update the Play Store app, clear its cache, and search for Fenix Yield again.\n\nBUYING ETH:\nIf someone has no ETH yet: Venmo and Robinhood both sell ETH and send it on Ethereum by default, which makes them beginner-friendly. In Venmo, crypto transfers must be turned on first. On an exchange such as Coinbase, they must choose the Ethereum network when withdrawing and NEVER Base, Arbitrum, Optimism or Polygon, because ETH sent on those networks will not reach their vault. Suggest buying a little extra to cover fees. These are third-party services Fenix is not affiliated with.\n\nALERTS AND AUTOMATION RULES:\nAlerts appear in the app's notification center. The app does not send push notifications to the phone's lock screen, so never promise those. Every withdrawal or send adds a Vault activity alert, and those cannot be turned off. In Settings users can switch these on or off: Rate alerts, Better opportunities, stETH price warnings and Auto-stake confirmations. Settings also has three automation rules: Switch gap (how much higher another pool's rate must be before new deposits go there), Minimum to invest (idle ETH below this is left alone) and Weekly limit (caps how much idle ETH automation invests per week). These rules only hold back automated investing.\n\nLEARNING MORE:\n- Fenix Intel (https://intel.fenix-yield.com) is our education and research hub for Ethereum staking, sold separately.\n- Our YouTube channel (https://www.youtube.com/@FenixIntel) has free Ethereum & Staking 101 episodes and a tour of the app.\n- Security guide: https://fenix-yield.com/security.html\n- App guide: https://fenix-yield.com/setup.html\n- Support: support@fenix-yield.com\n\nTELEGRAM BOT:\nThis website and this assistant only cover the app. If someone asks about the older Fenix Telegram bot, say that we no longer promote it and that this assistant can't help with it, and point them to support@fenix-yield.com. Do not say it has been shut down or is unsupported.\n\nSAFETY:\nNever ask for a recovery phrase, password or private key. If someone starts to share one, tell them to stop, because nobody at Fenix needs it. Never tell anyone to send ETH anywhere except their own vault address shown in the app.\n\nTONE:\n- Assume ZERO crypto knowledge.\n- Be warm, encouraging and patient.\n- Keep responses concise.\n- Never use jargon without explaining it.\n- Never make users feel stupid for not knowing crypto concepts.\n- Write plain text. Use double asterisks for bold if needed. Never use single asterisks, headings or tables, because they show up as raw symbols."

// ── Rendering ─────────────────────────────────────────────────────────────────

function addMessage(role, content, showAvatar = true) {
  const area = document.getElementById('chatArea');
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  if (showAvatar) {
    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.textContent = role === 'bot' ? '⚡' : '👤';
    wrap.appendChild(av);
  }

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = content;
  wrap.appendChild(bubble);
  area.appendChild(wrap);
  area.scrollTop = area.scrollHeight;

  // Wire up copy buttons inside bubble
  bubble.querySelectorAll('.copy-mini').forEach(btn => {
    btn.addEventListener('click', () => {
      const text = btn.previousElementSibling?.textContent || btn.dataset.copy;
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        btn.style.background = 'var(--success)';
        btn.style.color = '#fff';
        setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.color = ''; }, 2000);
      });
    });
  });

  return wrap;
}

function showTyping() {
  const area = document.getElementById('chatArea');
  const wrap = document.createElement('div');
  wrap.className = 'typing';
  wrap.id = 'typingIndicator';
  wrap.innerHTML = `
    <div class="msg-avatar" style="background:linear-gradient(135deg,var(--accent),var(--accent2))">⚡</div>
    <div class="typing-dots"><span></span><span></span><span></span></div>`;
  area.appendChild(wrap);
  area.scrollTop = area.scrollHeight;
}

function hideTyping() {
  document.getElementById('typingIndicator')?.remove();
}

function setQuickReplies(options) {
  const qr = document.getElementById('quickReplies');
  qr.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn';
    btn.textContent = opt;
    btn.onclick = () => {
      document.getElementById('userInput').value = opt;
      sendMessage();
    };
    qr.appendChild(btn);
  });
}

const DEFAULT_REPLIES = ['How do I install the app?', 'How do I deposit ETH?', 'Which pools can I use?', 'How do I withdraw?', 'How much does it cost?', 'Is it safe?'];

function pickQuickReplies(userText) {
  // Match on the user's own question (their intent).
  const t = (userText || '').toLowerCase();
  if (/withdraw|unstake|take.*out|cash out/.test(t))          return ['How do I send ETH out?', 'How do I stake again?', 'Are there any fees?'];
  if (/\bsend\b|transfer|move.*(out|wallet)|external/.test(t)) return ['How do I withdraw from a pool?', 'How much does it cost?', 'Is it safe?'];
  if (/install|download/.test(t))                             return ['I installed the app ✓', 'How do I create my wallet?', 'Is it safe?'];
  if (/create|wallet|vault|recovery|phrase|passkey|backup/.test(t)) return ['My wallet is ready ✓', 'How do I deposit ETH?', 'What if I lose my phrase?'];
  if (/deposit|fund|add (eth|money|funds)/.test(t))           return ['I deposited ETH ✓', 'How do I stake?', 'How long until it arrives?'];
  if (/stake|earn|pool|apy|rate/.test(t))                     return ['How do I withdraw?', 'What are the pools?', 'What are the risks?'];
  if (/cost|price|pay|subscri|how much/.test(t))              return ['How do I install the app?', 'How do I withdraw?', 'Is it safe?'];
  return DEFAULT_REPLIES;
}

function formatBotResponse(text) {
  // Escape the reply so it is shown as plain text; the only markup is what this function
  // adds below (bold, breaks).
  text = escapeHtml(text.trim());

  // Convert **bold** 
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

  // Convert newlines to paragraphs
  const paras = text.split(/\n\n+/).filter(p => p.trim());
  return paras.map(p => {
    const lines = p.split('\n').join('<br>');
    return `<p>${lines}</p>`;
  }).join('');
}

// ── API Call ──────────────────────────────────────────────────────────────────

// An error whose text is written for the visitor: the proxy's own refusals (a limit
// reached, a message too long, come back tomorrow) and our timeout. Anything else (no
// network, a Cloudflare error page) shows GENERIC_ERROR instead.
class VisitorError extends Error {}
const GENERIC_ERROR = 'Sorry, I had trouble connecting. Please try again in a moment.';
// Server text is shown as plain text, never as markup.
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function callClaude(userMessage) {
  conversation.push({ role: 'user', content: userMessage });

  // Hard timeout over the WHOLE exchange, reply body included: without this, a stalled
  // request (flaky mobile network, a proxy hiccup) never settles — the typing dots spin
  // forever and isTyping stays true, silently blocking every later message until the
  // page is reloaded. On ANY failure (a lost or unreadable reply included) we also roll
  // back the user turn just pushed, so a retry starts clean.
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 35000);

  try {
    const response = await fetch('https://api.fenix-yield.com/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model:      'claude-sonnet-5',
        max_tokens: 1000,
        system:     SYSTEM_PROMPT,
        messages:   conversation,
      }),
      signal: controller.signal,
    });
    // A body that isn't JSON (an error page, a reply cut off mid-download) counts as no
    // answer; only the timeout's abort is passed on as itself.
    const data = await response.json().catch(e => { if (e?.name === 'AbortError') throw e; return null; });

    if (!response.ok) {
      const msg = data?.error?.message;
      throw (response.status !== 403 && typeof msg === 'string' && msg.trim())
        ? new VisitorError(msg.slice(0, 300))
        : new Error(`HTTP ${response.status}`);
    }

    // claude-sonnet-5 can return an extended-thinking block first, so content[0] may be
    // {type:'thinking'} — pick the text block from the array rather than assuming [0].
    // Anything but a non-empty string is no reply, so nothing malformed joins the history.
    const blocks = Array.isArray(data?.content) ? data.content : [];
    const reply = blocks.find(b => b && b.type === 'text' && typeof b.text === 'string' && b.text.trim())?.text;
    if (!reply) throw new VisitorError('Sorry, something went wrong. Please try again.');

    conversation.push({ role: 'assistant', content: reply });
    return reply;
  } catch (e) {
    conversation.pop();
    throw (e?.name === 'AbortError')
      ? new VisitorError('The assistant took too long to respond. Please try again.')
      : e;
  } finally {
    clearTimeout(timer);
  }
}

// ── Send message ──────────────────────────────────────────────────────────────

window.sendMessage = async function() {
  if (isTyping) return;
  const input = document.getElementById('userInput');
  const text  = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('quickReplies').innerHTML = '';
  document.getElementById('sendBtn').disabled = true;

  addMessage('user', `<p>${escapeHtml(text)}</p>`);
  isTyping = true;
  showTyping();

  // Reassure on a normal-but-slow reply (~7s) so the wait never reads as frozen.
  const slowHint = setTimeout(() => {
    const dots = document.querySelector('#typingIndicator .typing-dots');
    if (dots && !dots.dataset.hinted) { dots.dataset.hinted = '1'; dots.insertAdjacentHTML('afterend', '<span style="color:var(--muted);font-size:12px;margin-left:8px;">still thinking…</span>'); }
  }, 6000);

  try {
    const reply = await callClaude(text);
    clearTimeout(slowHint);
    hideTyping();

    addMessage('bot', formatBotResponse(reply));
    setQuickReplies(pickQuickReplies(text));

  } catch (err) {
    clearTimeout(slowHint);
    hideTyping();
    addMessage('bot', `<p>${escapeHtml(err instanceof VisitorError ? err.message : GENERIC_ERROR)}</p>`);
    // Give the text back, so "too long" can be shortened and anything else re-sent.
    if (!input.value) { input.value = text; input.dispatchEvent(new Event('input')); }
    setQuickReplies(pickQuickReplies(text));
    console.error(err);
  }

  isTyping = false;
  document.getElementById('sendBtn').disabled = false;
};

// ── Input auto-resize + enter to send ────────────────────────────────────────

const input = document.getElementById('userInput');
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ── Initial greeting ──────────────────────────────────────────────────────────

function init() {
  addMessage('bot', `<p>👋 Hi! I'm the Fenix Yield assistant.</p>
<p>Ask me anything about the app: how to install it, create your wallet, deposit ETH, stake across the five pools, or get your ETH back out. No crypto experience needed.</p>`);
  setQuickReplies(DEFAULT_REPLIES);
}

init();
</script>
