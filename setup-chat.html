<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<title>Fenix Yield — Setup Assistant</title>
<style>
:root {
  --bg:      #0a0a0f;
  --surface: #13131a;
  --surface2:#1a1a24;
  --border:  #1e1e2e;
  --accent:  #7c5cfc;
  --accent2: #4fc3f7;
  --success: #4caf7d;
  --text:    #e8e8f0;
  --muted:   #6b6b8a;
  --font:    'Inter', system-ui, sans-serif;
  --mono:    'SF Mono', 'Fira Code', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

/* ── Header ── */
.header {
  background: linear-gradient(160deg, #0e0e1a, #12102a);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.header-logo {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}

.header-info { flex: 1; }
.header-info h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
.header-info p  { font-size: 12px; color: var(--success); margin-top: 1px; }

.header-link {
  font-size: 12px; color: var(--muted);
  text-decoration: none; padding: 6px 12px;
  border: 1px solid var(--border); border-radius: 8px;
  transition: all 0.15s; flex-shrink: 0;
}
.header-link:hover { border-color: var(--accent); color: var(--text); }

/* ── Progress bar ── */
.progress-bar {
  height: 3px;
  background: var(--border);
  flex-shrink: 0;
  position: relative;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  width: 0%;
  transition: width 0.5s ease;
}

/* ── Step indicator ── */
.step-indicator {
  display: flex;
  gap: 4px;
  padding: 10px 20px 8px;
  overflow-x: auto;
  scrollbar-width: none;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.step-indicator::-webkit-scrollbar { display: none; }

.step-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; color: var(--muted);
  flex-shrink: 0; transition: all 0.2s; cursor: default;
}
.step-dot.active {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(124,92,252,0.1);
}
.step-dot.done {
  border-color: var(--success);
  background: var(--success);
  color: #fff;
}

/* ── Chat area ── */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}

/* ── Messages ── */
.msg {
  display: flex;
  gap: 10px;
  max-width: 100%;
  animation: fadeUp 0.2s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0; margin-top: 2px;
}

.msg.bot .msg-avatar {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
}

.msg.user .msg-avatar {
  background: var(--surface2);
  border: 1px solid var(--border);
}

.msg-bubble {
  max-width: calc(100% - 48px);
  padding: 12px 14px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.6;
}

.msg.bot .msg-bubble {
  background: var(--surface);
  border: 1px solid var(--border);
  border-top-left-radius: 4px;
  color: var(--text);
}

.msg.user .msg-bubble {
  background: linear-gradient(135deg, var(--accent), #5b3fd8);
  color: #fff;
  border-top-right-radius: 4px;
}

.msg-bubble p { margin-bottom: 8px; }
.msg-bubble p:last-child { margin-bottom: 0; }

.msg-bubble .copy-addr {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent2);
  margin: 8px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  word-break: break-all;
}

.copy-mini {
  background: var(--border);
  border: none; border-radius: 4px;
  padding: 3px 8px; font-size: 10px;
  color: var(--muted); cursor: pointer;
  flex-shrink: 0; transition: all 0.15s;
}
.copy-mini:hover { background: var(--accent); color: #fff; }

/* ── Quick replies ── */
.quick-replies {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0 16px 12px;
  flex-shrink: 0;
}

.qr-btn {
  padding: 8px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.qr-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ── Typing indicator ── */
.typing {
  display: flex; gap: 10px; align-items: center;
}
.typing-dots {
  display: flex; gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  border-top-left-radius: 4px;
  padding: 12px 16px;
}
.typing-dots span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--muted);
  animation: bounce 1.2s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30%            { transform: translateY(-5px); opacity: 1; }
}

/* ── Input area ── */
.input-area {
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  flex-shrink: 0;
  background: var(--bg);
}

.input-wrap {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  align-items: flex-end;
  padding: 2px 4px 2px 14px;
  transition: border-color 0.15s;
}
.input-wrap:focus-within { border-color: var(--accent); }

#userInput {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  resize: none;
  outline: none;
  max-height: 120px;
  min-height: 40px;
  padding: 10px 0;
  line-height: 1.5;
}
#userInput::placeholder { color: var(--muted); }

.send-btn {
  width: 36px; height: 36px;
  border-radius: 9px;
  border: none;
  background: linear-gradient(135deg, var(--accent), #5b3fd8);
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.15s;
  flex-shrink: 0;
  margin-bottom: 2px;
}
.send-btn:hover { opacity: 0.85; }
.send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── Checklist inside bubble ── */
.inline-check { 
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0; font-size: 13px; color: var(--muted);
  cursor: pointer; user-select: none;
}
.inline-check.done { color: var(--success); }
.inline-check .ic-box {
  width: 18px; height: 18px; border-radius: 5px;
  border: 1.5px solid var(--muted);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 11px; transition: all 0.15s;
}
.inline-check.done .ic-box { background: var(--success); border-color: var(--success); color: #fff; }

/* ── Step complete badge ── */
.step-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(76,175,125,0.15);
  border: 1px solid rgba(76,175,125,0.3);
  color: var(--success);
  border-radius: 20px;
  padding: 4px 12px; font-size: 12px; font-weight: 600;
  margin-top: 8px;
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-logo">⚡</div>
  <div class="header-info">
    <h1>Fenix Yield Assistant</h1>
    <p>● Online — ready to help</p>
  </div>
  <a class="header-link" href="setup.html">📋 Step Guide</a>
</div>

<!-- Progress bar -->
<div class="progress-bar">
  <div class="progress-fill" id="progressFill"></div>
</div>

<!-- Step dots -->

</div>

<!-- Chat -->
<div class="chat-area" id="chatArea"></div>

<!-- Quick replies -->
<div class="quick-replies" id="quickReplies"></div>

<!-- Input -->
<div class="input-area">
  <div class="input-wrap">
    <textarea id="userInput" placeholder="Ask anything about setup..." rows="1"></textarea>
  </div>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
</div>

<script type="module">
// ── State ─────────────────────────────────────────────────────────────────────
const STEPS = [
  'Install apps',
  'Set up MetaMask',
  'Buy ETH',
  'Create Safe wallet',
  'Add bot signer',
  'Fund your Safe',
  'Set up Safe Mobile',
  'Register with bot',
  'Complete!'
];

// Contextual quick-reply chips for the TELEGRAM setup flow, indexed by step.
const stepReplies = [
  ['I installed all 3 apps ✓', 'What is MetaMask?', 'I only have iPhone'],
  ['I created my MetaMask wallet ✓', 'What is a seed phrase?', 'I forgot my password'],
  ['I bought ETH ✓', 'Which exchange should I use?', 'How much ETH do I need?'],
  ['I created my Safe wallet ✓', 'What is a Safe wallet?', 'I got an error'],
  ['I added the bot address ✓', "Where is Settings → Owners?", 'What does this do?'],
  ['I sent ETH to my Safe ✓', 'How do I check it arrived?', 'How much should I send?'],
  ['Safe Mobile is set up ✓', 'I cannot connect MetaMask', 'Where do I enable notifications?'],
  ['I registered with the bot ✓', 'How do I subscribe to a paid tier?', 'How do I withdraw my funds?', 'The bot is not responding', 'What tier am I on?'],
  ['🎉 All done!', 'How do I withdraw with /unstake?', 'How does auto-harvest work?', 'When do I get weekly reports?', 'What is the whitelist?'],
];

let currentStep  = 0;
let conversation = [];
let isTyping     = false;
let mode         = null; // 'mobile' | 'telegram' | null (path not chosen yet)

const SYSTEM_PROMPT = "You are the Fenix Yield onboarding assistant. Your job is to guide users through setting up the Fenix Yield automated ETH yield bot step by step.\n\nFenix Yield is a Telegram bot that automatically finds the best ETH yield across Lido, Curve, Aave, and Convex and proposes transactions to the user's Safe wallet. The user approves each transaction in Safe Mobile with one tap. The bot never holds or controls user funds.\n\nFENIX YIELD HAS THREE OPTIONS:\n- Scout (free, Telegram): monitoring only — live APYs, portfolio tracking, risk alerts. No Safe wallet needed.\n- Autopilot ($19/mo, or save up to 20% with 3/6/12 month plans, Telegram): everything in Scout PLUS daily yield automation on the user's own Gnosis Safe. By default the bot proposes transactions and the user approves in Safe Mobile with 1-3 taps; the user can optionally enable fully hands-free execution via the Zodiac Roles Module (no approvals needed). Includes auto-harvest of Convex rewards every 6 hours and auto-compounding.\n- MOBILE APP ($39/mo, launch price $29/mo for the first year then $39/mo — applied automatically on Google Play, no code needed): the simplest option — for people new to crypto, no MetaMask, no Safe, no Telegram. The app creates a secure built-in wallet automatically, secured by fingerprint/Face ID; the user just deposits ETH and earns, and can deposit, stake, and withdraw right in the app. Non-custodial — keys stay on the user's device. Coming soon to Google Play.\n\nMOBILE APP — FULL OPERATIONS (for users on the Fenix Yield mobile app, NOT Telegram — this is the simplest path: no MetaMask, no Safe, no Telegram). Walk mobile users through these:\n1. INSTALL: The Fenix Yield mobile app is coming soon to Google Play — it is not yet available to download directly. If a user wants it, tell them to join the waitlist on the pricing page (fenix-yield.com/pricing.html) and we will notify them the moment it launches. BEFORE installing, their phone must be ready (see MOBILE APP — PHONE SETUP below): Android 10 or newer, a screen lock set, and a Google account signed in. Full 2-minute guide: https://fenix-yield.com/phone-setup.html\n2. CREATE WALLET: Open the app and tap Create Vault. It secures the wallet with the phone passkey (Face ID or fingerprint) — no password to remember. It shows a 12-word recovery phrase — they must write it down and keep it safe; it is the only backup and Fenix never sees it. They confirm two of the words to continue.\n3. REFERRAL CODE (optional): If an influencer gave them a code, they enter it on the setup screen before creating the vault.\n4. DEPOSIT ETH: The app shows their vault address. They send ETH to it from any wallet or exchange, on Ethereum MAINNET only. Minimum about 0.01 ETH to start; 0.05 ETH or more recommended.\n5. EARN AND STAKE: Fenix automatically puts idle ETH to work in a strong pool — Lido, Curve, Aave, or Convex. In the Stake menu they set how much to auto-stake and how often (Auto, Daily, Weekly, or Off), and can pin a specific pool or leave it on Auto. They can also tap Stake Now to stake immediately; a confirmation dialog appears before it runs.\n6. CHECK PROGRESS: The Home screen shows their vault — idle ETH plus each pool and its balance. Markets shows live APYs. There is also an in-app AI assistant that answers questions using their real balance.\n7. WITHDRAW FROM A POOL: On the Home screen under In your vault, they tap the pool to exit, then Withdraw (all or a partial amount). It converts back to ETH inside their vault, approved with Face ID.\n8. SEND ETH OUT: They can send ETH from their vault to any external wallet, approved with Face ID. Only IDLE ETH can be sent — ETH staked in a pool must be withdrawn from that pool first.\n\nMOBILE APP KEY FACTS:\n- Non-custodial: the passkey and recovery phrase live only on the user device; Fenix cannot move funds without their Face ID approval.\n- Same four protocols and same 1.5% to 5% APY range (variable) as Autopilot.\n- No MetaMask, Safe, WalletConnect, or Telegram needed at all.\n- Subscription is $39/mo, with a launch offer of $29/mo for the first year (then $39/mo). On Google Play this launch discount is applied AUTOMATICALLY at checkout — there is NO promo code to enter. If a user asks where to enter a code or about 'LAUNCH29', reassure them the discounted first-year price shows up automatically in the app's subscribe screen; there is nothing to type. On Google Play the subscription is billed through Google Play and managed in the user Play account. If a user asks how to pay, tell them the app is coming soon to Google Play — do NOT give a direct download link or frame paying outside the store as a way to avoid store fees.\n- To move ETH to a personal wallet: if it is staked, withdraw it from the pool first, then use Send.\n\nMOBILE APP — PHONE SETUP (BEFORE INSTALLING):\nThe app protects the wallet with a passkey (unlocked by fingerprint, face, or screen lock), so the phone must be ready first. Walk users through this checklist when they are about to install, or whenever wallet creation fails:\n1. Screen lock set — REQUIRED (Settings > Security > Screen lock: PIN, pattern, or password; adding fingerprint or face unlock is strongly recommended so approving transactions is one touch).\n2. Signed into a Google account on the phone — REQUIRED (Settings > Passwords & accounts > Add account > Google). The passkey is stored by Google and the app installs through Google Play.\n3. Google enabled for passkeys — usually already on (Settings > Passwords & accounts > Passkeys, make sure Google is enabled).\n4. Android 10 or newer (Settings > About phone > Android version).\n5. Google Play up to date, and allow notifications when the app first asks (needed for security alerts).\nTROUBLESHOOTING: If wallet creation says 'no create options available' or 'your phone is not set up to create passkeys', it is almost always a missing screen lock or no Google account on the phone — have them complete steps 1-3, reopen the app, and tap Try again (their recovery phrase is not affected). If a tester cannot find the app on Google Play: they must open their invite link in Chrome and accept it, signed in with the SAME Google account the Play Store uses; new releases can also take up to 30 minutes to appear. Full step-by-step guide with exact menu paths: https://fenix-yield.com/phone-setup.html\n\nMOBILE APP — SMART ALERTS AND AUTOMATION RULES:\nThe app sends push notifications for meaningful events: a big APY rate move, when a clearly better pool is available, and a stETH depeg warning, plus a confirmation whenever it auto-stakes. Security alerts fire on every withdrawal or send-out and CANNOT be turned off — so a user always knows if funds move. All of these are managed in Settings. Users can also set their own automation rules with three sliders: a switch threshold (how much higher another pool's APY must be before the app auto-switches), a minimum-to-invest amount (idle ETH below this is left alone), and a weekly move limit (caps how much the automation reshuffles per week). These rules only HOLD BACK automated moves to match the user comfort level — they never trigger extra transactions.\n\nMOBILE APP — NETWORK (GAS) FEES:\nEvery on-chain action (stake, switch pools, withdraw, send) pays a small Ethereum network fee, usually just a few cents. The app shows the exact fee in ETH and USD BEFORE the user confirms and deducts it from that transaction — Fenix adds NO markup, it is the real network cost. The user first stake after setup and one withdrawal per calendar month are covered by Fenix (free). As a safety cap, if a fee would ever exceed 5% of the amount being moved, the app blocks the action and suggests waiting for lower gas or moving a larger amount. The subscription price never changes because of gas. On Telegram (Scout/Autopilot) gas is paid from the user own Safe as normal, typically under $0.10 per transaction.\n\nCHOOSING THE RIGHT PATH:\nEarly on, if you do not already know, ask whether they are using the MOBILE APP or the TELEGRAM bot (Scout or Autopilot). People new to crypto almost always want the Mobile App because it is the simplest. Only walk through the 8 Telegram setup steps (MetaMask, Safe, and so on) for Telegram users. For Mobile App users, use the mobile steps above and do NOT send them to MetaMask or Safe.\n\nPAYMENT OPTIONS:\nUsers can pay in two ways:\n\n1. CARD PAYMENT (/subscribe):\n- Send /subscribe autopilot\n- Bot shows plan duration: 1/3/6/12 months with discounts\n- Bot asks for email address (for invite code and receipt)\n- Bot asks for optional referral code\n- Bot generates a Chain2Pay checkout link\n- User pays with Visa, Mastercard, Apple Pay, or Google Pay\n- Invite code emailed automatically after payment (APX- for Autopilot)\n\n2. CRYPTO PAYMENT (/paycrypto) — ETH, USDC, or USDT:\n- Send /paycrypto autopilot USDC (or ETH/USDT)\n- Bot generates a unique wallet address + exact amount to send\n- Bot sends a QR code of the address\n- User sends crypto from any wallet (MetaMask, Coinbase, etc) to that address\n- Payment detected automatically within 30 seconds after 2 confirmations\n- Subscription activates instantly, invite code sent in Telegram\n- Use /checkpayment to manually check status\n- Use /cancelpayment to cancel and start fresh\n- Supported assets: ETH, USDC, USDT on Ethereum mainnet only\n\nYIELD STRATEGY:\n- Fenix Yield uses ONLY single-sided ETH strategies (cvxSTETH/stETH)\n- Principal always stays in ETH — never converted to volatile tokens\n- No CRV token risk, no impermanent loss from altcoin pairs\n- Realistic APY range: 1.5% to 5% depending on market conditions\n- Convex stETH/ETH pool typically leads at ~4-5% APY\n\nSETUP STEPS:\n1. Install 3 apps: Telegram, MetaMask, Safe Mobile\n2. Set up MetaMask wallet, save 12-word seed phrase, copy address\n3. Buy ETH on Coinbase, minimum 0.05 ETH, withdraw to MetaMask on Ethereum network\n4. Create a Safe wallet at app.safe.global, connect MetaMask, keep threshold 1 of 1, save Safe address\n5. Add bot proposer address as Safe owner: 0x739Df18DA29e0B9A408a1a66015f63B035112fBa via Settings, Owners, Add Owner\n6. Fund the Safe by sending ETH from MetaMask to Safe address, keep 0.005 ETH in MetaMask for gas\n7. Set up Safe Mobile, import Safe, connect MetaMask via WalletConnect, enable push notifications\n8. Register with @fenix_yield_bot on Telegram: send /start, enter your name, then type skip (Scout) or enter your invite code (paid tiers), then enter your Safe address and stake amount. The bot detects your Telegram automatically — there is NO chat ID to look up.\n\nIMPORTANT FACTS:\n- Bot proposer address: 0x739Df18DA29e0B9A408a1a66015f63B035112fBa\n- Setup guide: https://fenix-yield.com/setup.html\n- Scout tier is completely free and open — no invite code needed, just /start and type skip when asked\n- The paid Autopilot tier gets an invite code automatically after payment. Code prefix: APX- = Autopilot\n- Autopilot requires Zodiac Roles Module setup via /whitelist after registration\n- Safe address and MetaMask address are DIFFERENT\n- Always use Ethereum ERC-20 network when withdrawing from exchanges\n- Gas fees for recurring yield transactions are typically under $0.10; one-time setup steps (Safe creation ~$0.50, Zodiac module ~$2) cost more\n- Bot CANNOT move funds without user approval unless whitelist is enabled\n- Minimum stake amount is 0.01 ETH, recommended 0.05 ETH or more\n- Commands: /balance, /positions, /dashboard, /apy, /stake, /setstake, /setprotocol, /harvest, /unstake, /pause, /resume, /guide, /status, /history, /winner, /whitelist, /subscribe, /paycrypto, /checkpayment, /cancelpayment, /start\n\nAUTOMATIC FEATURES:\n- Weekly reports: every Monday the bot automatically sends a yield summary with APY, P&L, and total earned\n- Risk alerts: bot monitors hourly and alerts if ETH drops 10 percent or more, protocol APY collapses below 0.1 percent, or a transaction is stuck 48 hours or more\n- Auto-harvest (Autopilot only): every 6 hours bot checks Convex rewards, if above $10 claims and compounds automatically\n\nWHITELIST FEATURE (optional, advanced):\n- /whitelist lets users enable fully automatic execution via Zodiac Roles Module\n- Without whitelist: bot proposes transactions, user approves in Safe Mobile each time\n- With whitelist: bot executes transactions automatically, no approvals needed\n- Optional — turns Autopilot from approve-each-transaction into fully hands-free\n\nWITHDRAWALS (/unstake):\n- Telegram: users pull funds out of any protocol with /unstake <protocol> [amount|all], where protocol is lido, curve, aave, or convex. Example: /unstake convex all exits the whole Convex position; /unstake lido 0.5 exits part of a Lido position.\n- The bot builds the exit and proposes it to the user's Safe; the user approves AND executes each step in Safe Mobile, and the position converts back to plain ETH inside their Safe.\n- Multi-step exits (Lido, Aave, Convex) propose one step, wait for it to be executed on-chain, then propose the next — the user must Execute each step in Safe (not just approve), and do step 1 reasonably promptly.\n- The bot only converts positions back to ETH inside the Safe — it can NEVER send funds to an external address. To move ETH to a personal wallet, use Send in Safe Mobile.\n- Mobile App: withdrawing is one tap in-app (Face ID) — convert back to ETH, or send out to any wallet, no Safe or Telegram needed.\n\nTRANSACTION QUEUE MANAGEMENT:\n- Safe wallet has a transaction queue with nonces. Transactions must execute in order.\n- Bot only proposes ONE transaction at a time and checks for pending ones first.\n- Use /status to see pending transactions\n- To skip: reject in Safe Mobile for small gas fee, or /pause to stop bot\n\nTONE:\n- Assume ZERO crypto knowledge\n- Be warm, encouraging, and patient\n- Keep responses concise\n- Never use jargon without explaining it\n- When mentioning the proposer address always show it clearly\n\nSTEP TRACKING:\nThe step tracker at the top of the screen is for the TELEGRAM setup flow only. When a TELEGRAM user finishes one of the 8 Telegram setup steps, include [STEP_COMPLETE] at the very end of your response. For MOBILE APP users, do NOT use [STEP_COMPLETE] — the tracker does not apply to them.\nAlways be helpful, never make users feel stupid for not knowing crypto concepts."

// ── Rendering ─────────────────────────────────────────────────────────────────

function addMessage(role, content, showAvatar = true) {
  const area = document.getElementById('chatArea');
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  if (showAvatar) {
    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.textContent = role === 'bot' ? '⚡' : '👤';
    wrap.appendChild(av);
  }

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = content;
  wrap.appendChild(bubble);
  area.appendChild(wrap);
  area.scrollTop = area.scrollHeight;

  // Wire up copy buttons inside bubble
  bubble.querySelectorAll('.copy-mini').forEach(btn => {
    btn.addEventListener('click', () => {
      const text = btn.previousElementSibling?.textContent || btn.dataset.copy;
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        btn.style.background = 'var(--success)';
        btn.style.color = '#fff';
        setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.color = ''; }, 2000);
      });
    });
  });

  return wrap;
}

function showTyping() {
  const area = document.getElementById('chatArea');
  const wrap = document.createElement('div');
  wrap.className = 'typing';
  wrap.id = 'typingIndicator';
  wrap.innerHTML = `
    <div class="msg-avatar" style="background:linear-gradient(135deg,var(--accent),var(--accent2))">⚡</div>
    <div class="typing-dots"><span></span><span></span><span></span></div>`;
  area.appendChild(wrap);
  area.scrollTop = area.scrollHeight;
}

function hideTyping() {
  document.getElementById('typingIndicator')?.remove();
}

function setQuickReplies(options) {
  const qr = document.getElementById('quickReplies');
  qr.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn';
    btn.textContent = opt;
    btn.onclick = () => {
      document.getElementById('userInput').value = opt;
      sendMessage();
    };
    qr.appendChild(btn);
  });
}

function updateProgress() {
  const pct = (currentStep / (STEPS.length - 1)) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.querySelectorAll('.step-dot').forEach((dot, i) => {
    dot.classList.remove('active', 'done');
    if (i < currentStep)       dot.classList.add('done');
    else if (i === currentStep) dot.classList.add('active');
  });
}

function markStepComplete() {
  if (currentStep < STEPS.length - 1) {
    currentStep++;
    updateProgress();
  }
}

// ── Path detection + path-aware quick replies ────────────────────────────────
function detectMode(text) {
  const t = text.toLowerCase();
  if (/mobile app|the app\b|in-app|install the app|deposit and earn|face id|passkey/.test(t)) return 'mobile';
  if (/telegram|metamask|safe wallet|safe mobile|autopilot|\bscout\b|whitelist|invite code|proposer/.test(t)) return 'telegram';
  return null;
}

// The step tracker + progress bar are for the Telegram flow only — hide them for
// Mobile App users so they aren't shown 8 MetaMask/Safe steps that don't apply.
function applyModeChrome() {
  const hide = mode === 'mobile';
  const si = document.querySelector('.step-indicator');
  const pb = document.querySelector('.progress-bar');
  if (si) si.style.display = hide ? 'none' : '';
  if (pb) pb.style.display = hide ? 'none' : '';
}

const MOBILE_DEFAULT = ['How do I install the app?', 'How do I deposit ETH?', 'How do I withdraw?', 'How much does it cost?'];

function pickQuickReplies(userText, stepComplete) {
  if (stepComplete) return ['Continue to next step', 'I have a question first'];
  if (mode === 'mobile') {
    // Match on the user's own question (their intent) — the bot reply mentions
    // "Face ID" almost everywhere, which made reply-matching cross-fire.
    const t = (userText || '').toLowerCase();
    if (/withdraw|unstake|take.*out|cash out/.test(t))          return ['How do I send ETH out?', 'How do I stake again?', 'Are there any fees?'];
    if (/\bsend\b|transfer|move.*(out|wallet)|external/.test(t)) return ['How do I withdraw from a pool?', 'How much does it cost?', 'Is my money safe?'];
    if (/install|download/.test(t))                             return ['I installed the app ✓', 'How do I create my wallet?', 'Is it safe?'];
    if (/create|wallet|vault|recovery|phrase|passkey|backup/.test(t)) return ['My wallet is ready ✓', 'How do I deposit ETH?', 'What if I lose my phrase?'];
    if (/deposit|fund|add (eth|money|funds)/.test(t))           return ['I deposited ETH ✓', 'How do I start earning?', 'How long until it arrives?'];
    if (/stake|earn|pool|apy|pick.*pool/.test(t))               return ['How do I withdraw?', 'How do I pick a pool?', 'How do I send ETH out?'];
    if (/cost|price|pay|subscri|how much/.test(t))              return ['How do I install the app?', 'How do I withdraw?', 'Is it safe?'];
    return MOBILE_DEFAULT;
  }
  if (mode === 'telegram') {
    return stepReplies[Math.min(currentStep, stepReplies.length - 1)];
  }
  // Path not chosen yet — offer the choice plus common questions.
  return ['I want to use the Mobile App', "I'm setting up the Telegram bot", 'How do I pay?', 'How do I withdraw my funds?'];
}

function formatBotResponse(text) {
  // Remove [STEP_COMPLETE] marker from display
  text = text.replace('[STEP_COMPLETE]', '').trim();

  // Convert **bold** 
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

  // Detect and format the bot address
  const addr = '0x739Df18DA29e0B9A408a1a66015f63B035112fBa';
  if (text.includes(addr)) {
    text = text.replace(addr,
      `<span class="copy-addr"><span>${addr}</span><button class="copy-mini" data-copy="${addr}">Copy</button></span>`
    );
  }

  // Convert newlines to paragraphs
  const paras = text.split(/\n\n+/).filter(p => p.trim());
  return paras.map(p => {
    const lines = p.split('\n').join('<br>');
    return `<p>${lines}</p>`;
  }).join('');
}

// ── API Call ──────────────────────────────────────────────────────────────────

async function callClaude(userMessage) {
  conversation.push({ role: 'user', content: userMessage });

  // Hard timeout: without this, a stalled request (flaky mobile network, a proxy
  // hiccup) never settles — the typing dots spin forever and isTyping stays true,
  // silently blocking every later message until the page is reloaded. On ANY
  // failure we also roll back the user turn just pushed, so a retry starts clean.
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 35000);

  let response;
  try {
    response = await fetch('https://api.fenix-yield.com/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model:      'claude-sonnet-5',
        max_tokens: 1000,
        system:     SYSTEM_PROMPT,
        messages:   conversation,
      }),
      signal: controller.signal,
    });
  } catch (e) {
    conversation.pop();
    throw (e && e.name === 'AbortError')
      ? new Error('The assistant took too long to respond.')
      : e;
  } finally {
    clearTimeout(timer);
  }

  if (!response.ok) {
    conversation.pop();
    const err = await response.json().catch(() => ({}));
    throw new Error(err?.error?.message || `HTTP ${response.status}`);
  }

  const data  = await response.json();
  // claude-sonnet-5 can return an extended-thinking block first, so content[0] may be
  // {type:'thinking'} — pick the text block from the array rather than assuming [0].
  const reply = (data.content || []).find(b => b.type === 'text')?.text
    || 'Sorry, something went wrong. Please try again.';

  conversation.push({ role: 'assistant', content: reply });

  return reply;
}

// ── Send message ──────────────────────────────────────────────────────────────

window.sendMessage = async function() {
  if (isTyping) return;
  const input = document.getElementById('userInput');
  const text  = input.value.trim();
  if (!text) return;

  // Lock onto the user's path (mobile vs Telegram) so the chips match it.
  const detected = detectMode(text);
  if (detected && detected !== mode) { mode = detected; applyModeChrome(); }

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('quickReplies').innerHTML = '';
  document.getElementById('sendBtn').disabled = true;

  addMessage('user', `<p>${text}</p>`);
  isTyping = true;
  showTyping();

  // Reassure on a normal-but-slow reply (~7s) so the wait never reads as frozen.
  const slowHint = setTimeout(() => {
    const dots = document.querySelector('#typingIndicator .typing-dots');
    if (dots && !dots.dataset.hinted) { dots.dataset.hinted = '1'; dots.insertAdjacentHTML('afterend', '<span style="color:var(--muted);font-size:12px;margin-left:8px;">still thinking…</span>'); }
  }, 6000);

  try {
    const reply = await callClaude(text);
    clearTimeout(slowHint);
    hideTyping();

    const stepComplete = reply.includes('[STEP_COMPLETE]') && mode !== 'mobile';
    const html = formatBotResponse(reply);
    addMessage('bot', html);

    if (stepComplete) {
      markStepComplete();
      // Add step badge to last bot message (Telegram flow only)
      const lastBubble = document.querySelector('.msg.bot:last-child .msg-bubble');
      if (lastBubble && currentStep < STEPS.length) {
        const badge = document.createElement('div');
        badge.className = 'step-badge';
        badge.innerHTML = `✓ Step ${currentStep} complete — ${STEPS[currentStep - 1]} done!`;
        lastBubble.appendChild(badge);
      }
    }
    setQuickReplies(pickQuickReplies(text, stepComplete));

  } catch (err) {
    clearTimeout(slowHint);
    hideTyping();
    addMessage('bot', `<p>Sorry, I had trouble connecting. Please try again in a moment.</p>`);
    setQuickReplies(pickQuickReplies(text, false));
    console.error(err);
  }

  isTyping = false;
  document.getElementById('sendBtn').disabled = false;
};

// ── Input auto-resize + enter to send ────────────────────────────────────────

const input = document.getElementById('userInput');
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ── Initial greeting ──────────────────────────────────────────────────────────

function init() {
  updateProgress();

  const greeting = `<p>👋 Hi! I'm your Fenix Yield setup assistant.</p>
<p>I'll walk you through everything you need to get started earning automated ETH yield — no crypto experience needed.</p>
<p>Fenix Yield has three options: <strong>Scout</strong> (free monitoring on Telegram), <strong>Autopilot</strong> ($19/mo — daily yield on your own Safe; approve each transaction, or go fully hands-free), and the <strong>Mobile App</strong> ($39/mo, first year $29 then $39 — we create the wallet, you just deposit and earn).</p>
<p>Scout is free — no code needed. Autopilot needs an invite code, sent automatically after payment. New to crypto? The Mobile App is the easiest way to start.</p>
<p>To point you the right way — are you using the <strong>Mobile App</strong> or the <strong>Telegram bot</strong>?</p>`;

  addMessage('bot', greeting);

  setQuickReplies([
    'I want to use the Mobile App',
    "I'm setting up the Telegram bot",
    'How do I install the app?',
    'How do I deposit and earn?',
    'How do I withdraw my funds?',
    'How do I pay?',
    'What is the whitelist feature?',
  ]);
}

init();
